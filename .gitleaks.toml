[extend]
useDefault = true

[[rules]]
id = "angst-plaintext-secret-value"
description = "Plaintext secret value in secrets.yaml or secrets/master/ (not age-encrypted)"
regex = '''(?i)(password|passphrase|token|secret|api[_-]?key|access[_-]?key|client[_-]?secret)\s*[:=]\s*['"][^'"]{4,}['"]'''
path = "(secrets\\.ya?ml|secrets/master/)"

[[rules]]
id = "angst-projects-plaintext-secret-value"
description = "Plaintext secret value under projects/ (not age-encrypted tarball)"
regex = '''(?i)(password|passphrase|token|secret|api[_-]?key|access[_-]?key|client[_-]?secret)\s*[:=]\s*['"][^'"]{4,}['"]'''
path = "projects/.*"

[allowlist]
description = "angst: age envelopes/public keys, and documented examples"
regexes = [
  '''ENC\[AES256_GCM,''',
  '''-----BEGIN AGE ENCRYPTED FILE-----''',
  '''age-encryption\.org/v1''',
  '''age1[0-9a-z]{58}''',
]
paths = [
  "README\\.md",
  "pure\\.md",
  "analysis\\.md",
  "openwiki/",
  "secrets/ssh/.*\\.age",
  "secrets/ftp/.*\\.age",
  "secrets/vpn/.*\\.age",
]
