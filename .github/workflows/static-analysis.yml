name: static-analysis

on:
  push:
  pull_request:

jobs:
  static-analysis:
    name: repo-wide static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v27
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run static analysis
        run: nix-shell infra/static-analysis --run ./infra/static-analysis/static-analysis.sh
