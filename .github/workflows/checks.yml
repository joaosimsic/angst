name: checks
on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - '**.md'
              - 'justfile'
            tools:
              - 'runtime/**'

  eval-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'false' || needs.changes.outputs.tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint-themes
          - lint-desktop
          - lint-shell
          - theme-rendered
          - theme-override
          - theme-semantic-distinct
          - check-password
          - check-secrets-encrypted
          - check-projects-encrypted
          - check-ssh-keys
          - check-ftp-encrypted
          - check-projects-ftp-declared
          - check-projects-pipeline
          - check-ftp-pipeline
          - secret-scan
          - secret-scan-hooks
          - login-shell-valid
          - login-shell-invalid
          - lint-nix
          - eval-all
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build '.#checks.x86_64-linux.${{ matrix.check }}' --no-link --print-build-logs

  build-all:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'false' && needs.changes.outputs.tools == 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build '.#checks.x86_64-linux.build-all' --no-link --print-build-logs

  home-theme-override-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build '.#checks.x86_64-linux.home-theme-override-test' --no-link --print-build-logs

  nixfmt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'false' || needs.changes.outputs.tools == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run '.#formatter.x86_64-linux' -- --check $(git ls-files '*.nix')

  shellfmt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'false' || needs.changes.outputs.tools == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run nixpkgs#shfmt -- --diff $(git ls-files '*.sh')

  go:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'false' || needs.changes.outputs.tools == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check runtime Go
        run: |
          nix develop .#dev --command bash -lc \
            'for d in angst vm shell analyze; do echo "=== $d ==="; (cd runtime/$d && gofmt -l . && go vet ./... && go test ./...); done'


