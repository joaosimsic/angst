name: checks
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'justfile'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint-themes
          - lint-desktop
          - lint-shell
          - theme-rendered
          - theme-override
          - theme-semantic-distinct
          - check-password
          - check-secrets-encrypted
          - check-projects-encrypted
          - check-ssh-keys
          - check-ftp-encrypted
          - check-projects-ftp-declared
          - check-projects-pipeline
          - check-ftp-pipeline
          - secret-scan
          - secret-scan-hooks
          - login-shell-valid
          - login-shell-invalid
          - lint-nix
          - eval-all
          - check-session-env
          - check-session-usability
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: NIXPKGS_ALLOW_UNFREE=1 nix build '.#checks.x86_64-linux.${{ matrix.check }}' --impure --no-link --print-build-logs

  persist-ownership:
    name: persist-ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Determinate Systems installer enables KVM on Linux GitHub runners,
      # so no extra sandbox/system-features configuration is needed here.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: NIXPKGS_ALLOW_UNFREE=1 nix build '.#tests.x86_64-linux.persist-ownership' --impure --no-link --print-build-logs

  build-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: NIXPKGS_ALLOW_UNFREE=1 nix build '.#checks.x86_64-linux.build-ci' --impure --no-link --print-build-logs

  home-theme-override-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: NIXPKGS_ALLOW_UNFREE=1 nix build '.#checks.x86_64-linux.home-theme-override-test' --impure --no-link --print-build-logs

  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run '.#formatter.x86_64-linux' -- --check $(git ls-files '*.nix')

  shellfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run nixpkgs#shfmt -- --diff $(git ls-files '*.sh')

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check runtime Go
        run: |
          nix develop .#dev --command bash -lc \
            'for d in angst vm shell analyze; do echo "=== $d ==="; (cd runtime/$d && gofmt -l . && go vet ./... && go test ./...); done'
