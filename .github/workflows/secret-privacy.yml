name: secret-privacy
on:
  push:
    paths:
      - "infra/contracts/secret-ref.nix"
      - "infra/contracts/secret-ref.test.nix"
      - "infra/lib/types.nix"
      - "infra/lib/match.nix"
      - "infra/logger/default.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/secret-privacy.yml"
  pull_request:
    paths:
      - "infra/contracts/secret-ref.nix"
      - "infra/contracts/secret-ref.test.nix"
      - "infra/lib/types.nix"
      - "infra/lib/match.nix"
      - "infra/logger/default.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/secret-privacy.yml"
jobs:
  secret_privacy:
    name: secret ref privacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout secret domain
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v27
      - name: Nix secret privacy eval
        working-directory: .
        run: |
          set -euo pipefail
          nix eval --impure --expr 'import ./infra/contracts/secret-ref.test.nix'
          NIXPKGS_ALLOW_UNFREE=1 nix flake check --no-build --impure
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go logger gate
        working-directory: infra/logger
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./... -count=1 -v
