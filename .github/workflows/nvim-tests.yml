name: nvim-tests
on:
  push:
    branches:
      - '**'
    paths:
      - 'domains/editor/nvim/**'
      - '.github/workflows/nvim-tests.yml'
  pull_request:
    paths:
      - 'domains/editor/nvim/**'
      - '.github/workflows/nvim-tests.yml'
jobs:
  nvim-tests:
    runs-on: ubuntu-latest
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Cache lazy plugins
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim/lazy
          key: lazy-${{ hashFiles('domains/editor/nvim/config/lazy-lock.json') }}
          restore-keys: lazy-
      - name: Link Neovim config
        run: |
          mkdir -p ~/.config
          ln -sfn "$PWD/domains/editor/nvim/config" ~/.config/nvim

      - name: Render generated theme palette
        run: |
          # palette.lua is generated by domains/editor/nvim/render.nix and
          # gitignored, so a fresh checkout lacks it and any module doing
          # require("config.theme.palette") fails. Render the CI host theme
          # (see hosts/ci/default.nix) before plugins load and tests run.
          nix eval --raw '.#lib.renderDomainOutputFor' \
            --apply 'f: f "miasma" "domains/editor/nvim/config/lua/config/theme/palette.lua"' \
            > domains/editor/nvim/config/lua/config/theme/palette.lua

      - name: Install Neovim plugins
        run: |
          nix develop .#safe --command bash -c \
            "cd domains/editor/nvim/config && nvim --headless '+Lazy! sync' +qa"
      - name: Run Neovim adapter tests
        run: |
          nix develop .#safe --command bash -c \
            "cd domains/editor/nvim/config && nvim --headless -u NONE -l tests/adapters/init.lua"
      - name: Run Neovim frontend tests
        run: |
          nix develop .#safe --command bash -c \
            "cd domains/editor/nvim/config && nvim --headless -u NONE -l tests/frontend/init.lua"
