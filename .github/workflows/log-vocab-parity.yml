---
name: log-vocab-parity
"on":
  push:
    paths:
      - "infra/contracts/**"
      - "infra/lib/**"
      - "infra/logger/**"
      - "workflow/phases.nix"
      - ".github/workflows/log-vocab-parity.yml"
  pull_request:
    paths:
      - "infra/contracts/**"
      - "infra/lib/**"
      - "infra/logger/**"
      - "workflow/phases.nix"
      - ".github/workflows/log-vocab-parity.yml"
permissions:
  contents: read
concurrency:
  group: log-vocab-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  log_vocab_parity:
    name: log domain vocab parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout log domain
        uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v27
      - name: Nix log domain tests
        run: |
          set -euo pipefail
          nix eval --impure --expr 'import ./infra/logger/test.nix'
          NIXPKGS_ALLOW_UNFREE=1 nix flake check --no-build --impure
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go logger tests
        working-directory: infra/logger
        run: CGO_ENABLED=0 go test ./... -count=1 -v
