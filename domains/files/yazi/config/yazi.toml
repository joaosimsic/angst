[mgr]
show_hidden = true
linemode = "persist"

[opener]
celluloid = [
	{ run = "celluloid %s1", desc = "Celluloid", for = "linux", orphan = true },
]

[open]
prepend_rules = [
	{ url = "*.{doc,docx,docm,dot,dotx,dotm,odt,ott,rtf,xls,xlsx,xlsm,xlt,xltx,xltm,ods,ots,csv,ppt,pptx,pptm,pot,potx,potm,odp,otp}", use = "open" },
	{ mime = "video/*", use = "celluloid" },
]

[plugin]
prepend_fetchers = [
	{ url = "*", run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
]
